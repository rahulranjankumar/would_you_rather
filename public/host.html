<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Host Console — Would You Rather / Quiz</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div id="brand"></div>
<div class="wrap">

  <!-- SETUP (reused for first create AND for "new game" after End) -->
  <div id="setup" class="glass card pad-lg fade-in">
    <div class="pill">🎛️ Host Console</div>
    <h1 id="setupTitle">Set up your game</h1>
    <div class="sub">Pick a game type and settings, then open the Big Screen and share it on Teams.</div>

    <label>Game type</label>
    <div class="seg" id="typeSeg">
      <button data-v="wyr" class="active">🎲 Would You Rather</button>
      <button data-v="quiz">🧠 Quiz (has correct answers)</button>
    </div>

    <div class="grid2 mt">
      <div>
        <label>Scoring / leaderboard</label>
        <div class="seg" id="scoreSeg">
          <button data-v="points" class="active">🏆 Leaderboard on</button>
          <button data-v="fun">😄 Just for fun</button>
        </div>
      </div>
      <div>
        <label>Timer per question</label>
        <select id="timer">
          <option value="15000">15 seconds</option>
          <option value="20000" selected>20 seconds</option>
          <option value="30000">30 seconds</option>
          <option value="45000">45 seconds</option>
        </select>
      </div>
    </div>

    <button class="btn mt2" id="createBtn">Create room →</button>
    <div id="setupNote" class="sub mt hide"></div>
    <button class="btn ghost small mt hide" id="cancelSetup">← Back to current game</button>
  </div>

  <!-- CONSOLE -->
  <div id="console" class="hide">
    <div id="banner" class="glass card hide" style="border-color:rgba(255,176,32,.5);background:rgba(255,176,32,.1);margin-bottom:14px;padding:14px 18px;font-size:14px"></div>
    <div class="grid2">
      <div class="glass card center">
        <div class="qcategory">Scan to join · or enter the code</div>
        <div class="roomcode" id="code">—</div>
        <div class="qr"><img id="qr" alt="Join QR" onerror="this.style.display='none'"></div>
        <div class="muted mt" style="word-break:break-all">Join link: <span id="joinUrl" style="color:#d9b6ff"></span></div>
        <a class="btn ghost small mt" id="screenLink" target="_blank">📺 Open Big Screen (share on Teams)</a>
      </div>

      <div class="glass card">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
          <div><b id="statusLbl">LOBBY</b> <span class="muted" id="typeLbl"></span><div class="muted" id="progressLbl">Not started</div></div>
          <div class="badge win badge-count">👥 <span id="pcount">0</span></div>
        </div>

        <div class="qcategory mt2" id="hcat"></div>
        <div class="question" id="hqtext" style="font-size:clamp(17px,3.4vw,20px);min-height:34px">Waiting to start…</div>
        <div class="options" id="hopts" style="display:none"></div>
        <div class="muted mt" id="votedLbl"></div>
        <div class="resrow mt" id="hres"></div>

        <div class="btn-row mt2">
          <button class="btn" id="startBtn">▶ Start</button>
          <button class="btn ghost" id="lockBtn">🔒 Lock</button>
          <button class="btn ghost" id="nextBtn">Next →</button>
        </div>
        <div class="btn-row mt">
          <button class="btn ghost small" id="restartBtn">🔁 Restart (same)</button>
          <button class="btn ghost small" id="endBtn">⏹ End game</button>
        </div>
      </div>
    </div>

    <div class="glass card mt" id="hostLbCard">
      <b>🏅 Leaderboard</b>
      <div class="list" id="lb"></div>
    </div>
  </div>
</div>
<div id="footer"></div>

<script src="/shared.js"></script>
<script>
addBlobs();
document.getElementById('brand').innerHTML = BRAND_BAR;
document.getElementById('footer').innerHTML = BRAND_FOOTER;

let host = JSON.parse(localStorage.getItem('wyr_host') || 'null');
let lastQuestion = null;
let sel = { gameType:'wyr', scoringMode:'points' };

// segmented controls
function wireSeg(id, key){
  document.querySelectorAll('#'+id+' button').forEach(b=>{
    b.onclick=()=>{ document.querySelectorAll('#'+id+' button').forEach(x=>x.classList.remove('active')); b.classList.add('active'); sel[key]=b.dataset.v; };
  });
}
wireSeg('typeSeg','gameType'); wireSeg('scoreSeg','scoringMode');

function readSetup(){ return { gameType:sel.gameType, scoringMode:sel.scoringMode, timerMs:parseInt(document.getElementById('timer').value,10) }; }

// mode: 'create' (fresh room) or 'reconfigure' (existing room, new settings)
let setupMode = 'create';
function openSetup(mode){
  setupMode = mode;
  document.getElementById('console').classList.add('hide');
  document.getElementById('setup').classList.remove('hide');
  document.getElementById('setupTitle').textContent = mode==='reconfigure' ? 'Start a new game' : 'Set up your game';
  document.getElementById('createBtn').textContent = mode==='reconfigure' ? 'Start new game →' : 'Create room →';
  document.getElementById('cancelSetup').classList.toggle('hide', mode!=='reconfigure');
}

document.getElementById('cancelSetup').onclick = ()=>{ document.getElementById('setup').classList.add('hide'); document.getElementById('console').classList.remove('hide'); };

document.getElementById('createBtn').onclick = async () => {
  const s = readSetup();
  const btn = document.getElementById('createBtn'); btn.disabled = true; const old = btn.textContent; btn.textContent = 'Working…';
  if (setupMode === 'reconfigure' && host){
    await API.post('/api/host', { roomCode:host.room, hostToken:host.hostToken, action:'reconfigure', ...s });
    host = {...host, ...s}; localStorage.setItem('wyr_host', JSON.stringify(host));
    document.getElementById('setup').classList.add('hide'); document.getElementById('console').classList.remove('hide');
  } else {
    const res = await API.post('/api/room/create', s);
    if (res.error){ btn.disabled=false; btn.textContent=old; return alert(res.error); }
    host = { room: res.roomCode, hostToken: res.hostToken, ...s };
    localStorage.setItem('wyr_host', JSON.stringify(host));
    boot();
  }
  btn.disabled = false; btn.textContent = old;
};

function act(action, extra){ return API.post('/api/host', { roomCode: host.room, hostToken: host.hostToken, action, ...(extra||{}) }); }
document.getElementById('startBtn').onclick = ()=>act('start');
document.getElementById('nextBtn').onclick  = ()=>act('next');
document.getElementById('lockBtn').onclick  = ()=>act('lock');
document.getElementById('restartBtn').onclick = ()=>{ if(confirm('Restart with the SAME settings? Scores reset to 0; players stay joined.')) act('restart'); };
document.getElementById('endBtn').onclick    = ()=>{ if(confirm('End the game and choose new settings (game type / leaderboard)?')){ act('end'); openSetup('reconfigure'); } };

function showBanner(html){ const b=document.getElementById('banner'); b.innerHTML=html; b.classList.remove('hide'); }
function renderLB(list){ document.getElementById('lb').innerHTML = leaderboardRowsHTML(list); }
function applyLbVisibility(){ document.getElementById('hostLbCard').classList.toggle('hide', (host.scoringMode||'points')!=='points'); }

async function boot(){
  if (!host) return;
  const check = await API.post('/api/room/verify', { roomCode: host.room, hostToken: host.hostToken });
  if (!check.ok) {
    const res = await API.post('/api/room/create', { gameType:host.gameType, scoringMode:host.scoringMode, timerMs:host.timerMs });
    if (res.error){ openSetup('create'); return; }
    host = { room: res.roomCode, hostToken: res.hostToken, gameType:host.gameType, scoringMode:host.scoringMode, timerMs:host.timerMs };
    localStorage.setItem('wyr_host', JSON.stringify(host));
    showBanner('⚠️ Your previous room expired (server restarted), so a fresh room <b>'+host.room+'</b> was created. Share this new code / QR.');
  } else if (check.settings){ host = {...host, ...check.settings}; }

  document.getElementById('setup').classList.add('hide');
  document.getElementById('console').classList.remove('hide');
  const joinUrl = location.origin + '/?room=' + host.room;
  document.getElementById('code').textContent = host.room;
  document.getElementById('joinUrl').textContent = joinUrl;
  document.getElementById('qr').src = qrImageURL(joinUrl, 200);
  document.getElementById('screenLink').href = '/screen?room=' + host.room;
  applyLbVisibility();

  connectSSE({ room: host.room, role:'host', handlers:{
    sync(s){ if(s.settings){} paint(s); },
    'lobby:update'(d){ document.getElementById('pcount').textContent = d.playerCount; },
    'question:show'(q){ lastQuestion=q; paintQuestion(q); },
    'vote:progress'(d){ document.getElementById('votedLbl').textContent = d.votedCount+' of '+d.totalCount+' voted'; },
    'votes:locked'(){ document.getElementById('statusLbl').textContent='LOCKED'; },
    'results:reveal'(d){ paintResults({...d, options:lastQuestion&&lastQuestion.options}); },
    'leaderboard:update'(d){ renderLB(d.top); },
    'game:over'(d){ document.getElementById('statusLbl').textContent='GAME OVER'; renderLB(d.leaderboard);
      document.getElementById('hcat').textContent=''; document.getElementById('hqtext').textContent='🎬 Game over! Pick new settings, restart, or start again.';
      document.getElementById('hopts').style.display='none'; document.getElementById('hres').innerHTML=''; document.getElementById('startBtn').textContent='▶ Start'; },
    'game:restart'(d){ if(d){ host.gameType=d.gameType||host.gameType; host.scoringMode=d.scoringMode||host.scoringMode; localStorage.setItem('wyr_host',JSON.stringify(host)); applyLbVisibility(); }
      document.getElementById('hqtext').textContent='🔁 New round ready! Waiting to start…'; document.getElementById('hopts').style.display='none'; document.getElementById('hres').innerHTML=''; document.getElementById('votedLbl').textContent=''; renderLB([]); },
  }});
}

function paint(s){
  if (s.gameType){ host.gameType=s.gameType; document.getElementById('typeLbl').textContent = '· '+(s.gameType==='quiz'?'🧠 Quiz':'🎲 WYR'); }
  if (s.scoringMode){ host.scoringMode=s.scoringMode; applyLbVisibility(); }
  document.getElementById('pcount').textContent = s.playerCount;
  document.getElementById('statusLbl').textContent = s.status;
  document.getElementById('progressLbl').textContent = s.questionNumber>0 ? ('Question '+s.questionNumber+' of '+s.totalQuestions) : 'Not started';
  document.getElementById('startBtn').textContent = (s.status==='LOBBY'||s.status==='GAME_OVER') ? '▶ Start' : '▶ Resume';
  if (s.question) lastQuestion = s.question;
  if (s.status==='QUESTION_ACTIVE' && s.question) paintQuestion({...s.question, questionNumber:s.questionNumber, totalQuestions:s.totalQuestions});
  else if (s.status==='RESULTS' && s.results){ paintQuestionText(s.question); paintResults({...s.results, gameType:s.gameType, options:s.question&&s.question.options}); }
  else if (s.status==='LOBBY'){ document.getElementById('hqtext').textContent='Waiting to start…'; document.getElementById('hopts').style.display='none'; document.getElementById('hres').innerHTML=''; }
  renderLB(s.leaderboard);
}
function paintQuestionText(q){
  if(!q) return;
  document.getElementById('hcat').textContent = q.category||'';
  document.getElementById('hqtext').textContent = q.prompt||'Would you rather…';
  const wrap=document.getElementById('hopts'); wrap.style.display='grid'; wrap.className='options n'+(q.options||[]).length;
  wrap.innerHTML=(q.options||[]).map((t,i)=>`<div class="opt" data-i="${i}" style="min-height:72px"><span class="tag">${OPT_LETTERS[i]}</span><span class="opt-text" style="font-size:13px">${esc(t)}</span></div>`).join('');
}
function paintQuestion(q){
  document.getElementById('statusLbl').textContent='QUESTION_ACTIVE';
  if (q.questionNumber) document.getElementById('progressLbl').textContent='Question '+q.questionNumber+' of '+q.totalQuestions;
  paintQuestionText(q);
  document.getElementById('hres').innerHTML=''; document.getElementById('votedLbl').textContent='0 voted';
}
function paintResults(d){
  document.getElementById('statusLbl').textContent='RESULTS';
  const opts=d.options||[]; const correct=(d.gameType==='quiz')?d.correct:null;
  document.getElementById('hres').innerHTML=(d.percents||[]).map((pct,i)=>
    resultBarHTML(opts[i]||'', i, pct, (d.counts||[])[i]||0, {correct, winners:d.winners, showCounts:false})
  ).join('');
  document.getElementById('votedLbl').textContent = (d.total||0)+' votes';
}

if (host) boot();
</script>
</body>
</html>
