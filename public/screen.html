<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Big Screen — Fun Friday</title>
<link rel="stylesheet" href="/app.css">
<style>
  body{overflow:hidden}
  .stage{height:100vh;display:flex;flex-direction:column}
  .stage .body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;min-height:0}
  .huge{font-size:clamp(24px,4vw,54px);font-weight:800;line-height:1.16;margin:6px 0 22px;max-width:1150px;letter-spacing:-.02em}
  .bigopts{display:grid;gap:20px;width:min(1150px,94vw)}
  .bigopts.n2{grid-template-columns:1fr 1fr}.bigopts.n3{grid-template-columns:1fr 1fr 1fr}.bigopts.n4{grid-template-columns:1fr 1fr}
  @media(max-width:820px){.bigopts.n2,.bigopts.n3,.bigopts.n4{grid-template-columns:1fr}}
  .bigopt{border-radius:var(--r-lg);min-height:22vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    font-size:clamp(16px,2vw,30px);font-weight:800;padding:22px;position:relative;overflow:hidden;
    background:linear-gradient(160deg,var(--glass-14),var(--glass-06));border:1px solid var(--glass-brd);
    backdrop-filter:blur(var(--blur-md)) saturate(160%);box-shadow:var(--shadow-depth),inset 0 1px 0 var(--glass-hi);
    animation:cardIn .55s var(--ease-expo) both}
  .bigopt .lt{width:clamp(40px,4vw,58px);height:clamp(40px,4vw,58px);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:clamp(20px,2.2vw,34px);font-weight:900;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.32);position:relative;z-index:1}
  .bigopt .bt{position:relative;z-index:1;line-height:1.25;word-break:break-word;text-shadow:0 1px 10px rgba(0,0,0,.4)}
  .bigopt::before{content:"";position:absolute;inset:0;background:radial-gradient(130% 90% at 50% 0%,var(--w,rgba(161,0,255,.34)),transparent 62%)}
  .bigopt[data-i="0"]{--w:rgba(161,0,255,.34);border-color:rgba(161,0,255,.4)}.bigopt[data-i="1"]{--w:rgba(0,230,210,.3);border-color:rgba(0,230,210,.4)}
  .bigopt[data-i="2"]{--w:rgba(255,79,216,.3);border-color:rgba(255,79,216,.4)}.bigopt[data-i="3"]{--w:rgba(255,176,32,.3);border-color:rgba(255,176,32,.4)}
  /* live mini-fill that breathes as votes stream in */
  .bigopt .live{position:absolute;left:0;bottom:0;height:6px;width:0;border-radius:0 6px 6px 0;transition:width .6s var(--ease-expo);z-index:1}
  .bigopt[data-i="0"] .live{background:#A100FF}.bigopt[data-i="1"] .live{background:#00E6D2}.bigopt[data-i="2"] .live{background:#FF4FD8}.bigopt[data-i="3"] .live{background:#FFB020}
  .bigbars{display:flex;flex-direction:column;gap:14px;width:min(1150px,94vw)}
  .bbar{position:relative;height:clamp(60px,11vh,92px);border-radius:var(--r-md);overflow:hidden;background:rgba(0,0,0,.3);border:1px solid var(--glass-brd);box-shadow:inset 0 1px 0 var(--glass-hi)}
  .bbar .bfill{position:absolute;left:0;top:0;bottom:0;width:0;transition:width 1.1s var(--ease-expo)}
  .bbar .bfill::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.28),transparent 55%)}
  .bfill.i0{background:linear-gradient(135deg,#7a1fd0,#A100FF)}.bfill.i1{background:linear-gradient(135deg,#08a596,#00E6D2)}.bfill.i2{background:linear-gradient(135deg,#c22aa0,#FF4FD8)}.bfill.i3{background:linear-gradient(135deg,#c98315,#FFB020)}
  .bbar .bc{position:relative;z-index:2;display:flex;align-items:center;gap:16px;height:100%;padding:0 22px}
  .bbar .blt{flex:0 0 auto;width:clamp(34px,3vw,46px);height:clamp(34px,3vw,46px);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:clamp(16px,1.8vw,24px);background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35)}
  .bbar .blab{flex:1;min-width:0;text-align:left;font-size:clamp(16px,1.9vw,28px);font-weight:700;overflow-wrap:anywhere;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  .bbar .bpct{flex:0 0 auto;font-size:clamp(20px,2.4vw,36px);font-weight:900;font-variant-numeric:tabular-nums;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  .bbar.correct{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,206,74,.45),0 0 34px rgba(255,206,74,.3)}
  .bbar.correct .blt{background:var(--gold);color:#2a1e00}
  .joininfo{display:flex;gap:40px;align-items:center;justify-content:center;flex-wrap:wrap}
  .qr-lg{background:#fff;padding:16px;border-radius:var(--r-md);box-shadow:0 18px 50px rgba(0,0,0,.5),0 0 46px rgba(161,0,255,.22)}
  .qr-lg img{display:block;width:clamp(180px,22vw,230px);height:auto}
  .lb-lg .row{font-size:clamp(17px,2vw,26px);padding:15px 20px}
  .topbar{display:flex;justify-content:space-between;align-items:center;padding:12px 28px;gap:12px}
</style>
</head>
<body data-intro="always">
<div class="stage">
  <div id="brand"></div>
  <div class="topbar">
    <div class="qcategory" id="cat" style="font-size:clamp(12px,1.4vw,20px)">READY</div>
    <div class="ring-wrap" id="ringWrap" style="display:none">
      <svg width="64" height="64" viewBox="0 0 64 64">
        <defs><linearGradient id="ringgrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#A100FF"/><stop offset="1" stop-color="#00E6D2"/></linearGradient></defs>
        <circle class="rtrack" cx="32" cy="32" r="27" fill="none" stroke-width="6"/>
        <circle class="rprog" id="ringProg" cx="32" cy="32" r="27" fill="none" stroke-width="6" stroke-dasharray="169.6" stroke-dashoffset="0"/>
      </svg>
      <div class="rnum" id="ringNum">0</div>
    </div>
    <div class="badge win count" style="font-size:clamp(14px,1.6vw,22px)">👥 <span id="pcount">0</span></div>
  </div>
  <div class="body">
    <div id="lobby">
      <div class="pill" id="lobbyPill" style="font-size:16px">🎉 Fun Friday · Currys project team</div>
      <div class="huge" id="lobbyTitle">Would You Rather?</div>
      <div class="joininfo">
        <div class="qr-lg"><img id="qr" alt="Scan to join" onerror="this.style.display='none'"></div>
        <div><div style="font-size:20px" class="muted">Join at</div><div id="joinurl" style="font-size:clamp(18px,2vw,28px);font-weight:700;color:#d9b6ff"></div>
          <div style="font-size:20px" class="muted mt2">Room code</div><div class="roomcode" id="code">—</div></div>
      </div>
      <div class="mt2 muted" style="font-size:20px"><span class="big" id="lc">0</span> players joined</div>
    </div>
    <div id="qview" class="hide" style="width:100%;display:flex;flex-direction:column;align-items:center">
      <div class="huge" id="qtext">…</div>
      <div class="bigopts" id="bigopts"></div>
      <div class="mt2 muted" style="font-size:22px" id="votecount">0 of 0 voted</div>
    </div>
    <div id="locked" class="hide frost-pulse"><div class="huge">🔒 Votes locked!</div><div class="muted" style="font-size:24px">Revealing…</div></div>
    <div id="results" class="hide stage-in" style="width:100%;display:flex;flex-direction:column;align-items:center">
      <div class="huge" id="rtext" style="margin-bottom:12px">The room has spoken!</div>
      <div class="bigbars" id="bigbars"></div>
    </div>
    <div id="over" class="hide stage-in" style="width:100%;max-width:800px">
      <div class="huge">🏆 Final Leaderboard</div><div class="list lb-lg" id="lb"></div>
      <div class="muted mt2" style="font-size:20px">Thanks for playing! 🎉</div>
    </div>
  </div>
</div>
<script src="/shared.js"></script>
<script src="/intro.js"></script>
<script>
addAurora();
document.getElementById('brand').innerHTML = BRAND_BAR;
const room=(new URLSearchParams(location.search).get('room')||'').toUpperCase();
if(!room){ document.body.innerHTML='<div class="center"><h1>Add ?room=CODE to the URL</h1></div>'; }
let gameType='wyr', currentOptions=[], totalPlayers=0;
const views=['lobby','qview','locked','results','over'];
function show(id){ views.forEach(v=>{ const el=document.getElementById(v); if(el){ el.classList.toggle('hide',v!==id); if(v===id&&el.classList.contains('stage-in')){el.classList.remove('stage-in');void el.offsetWidth;el.classList.add('stage-in');} } }); }
const joinUrl=location.origin+'/?room='+room;
document.getElementById('code').textContent=room; document.getElementById('joinurl').textContent=location.host; document.getElementById('qr').src=qrImageURL(joinUrl,230);
const RING_LEN=169.6;
const cd=makeCountdown((r,dur)=>{ const rw=document.getElementById('ringWrap'); rw.style.display=r>0?'block':'none'; const s=Math.ceil(r/1000); document.getElementById('ringNum').textContent=s>0?s:''; const frac=dur?Math.max(0,Math.min(1,r/dur)):0; document.getElementById('ringProg').style.strokeDashoffset=(RING_LEN*(1-frac)).toFixed(1); document.getElementById('ringNum').classList.toggle('low',s<=5&&r>0); });
function setTypeLabels(){ document.getElementById('lobbyTitle').textContent=gameType==='quiz'?'Quiz Time! 🧠':'Would You Rather?'; document.getElementById('cat').textContent=gameType==='quiz'?'QUIZ':'WOULD YOU RATHER'; }
function renderQ(q){
  show('qview'); currentOptions=q.options||[]; if(q.gameType)gameType=q.gameType;
  document.getElementById('cat').textContent=(q.category||'').toUpperCase()||(gameType==='quiz'?'QUIZ':'WOULD YOU RATHER');
  document.getElementById('qtext').textContent=q.prompt||(gameType==='quiz'?'Question':'Would you rather…');
  const wrap=document.getElementById('bigopts'); wrap.className='bigopts n'+currentOptions.length;
  wrap.innerHTML=currentOptions.map((t,i)=>`<div class="bigopt" data-i="${i}"><span class="lt">${OPT_LETTERS[i]}</span><span class="bt">${esc(t)}</span><span class="live"></span></div>`).join('');
  if(q.startedAt&&q.durationMs)cd.start(q.startedAt,q.durationMs);
}
function liveUpdate(counts){ const total=(counts||[]).reduce((a,b)=>a+b,0)||1; document.querySelectorAll('#bigopts .bigopt').forEach(el=>{ const i=parseInt(el.dataset.i,10); const pct=Math.round(((counts[i]||0)/total)*100); el.querySelector('.live').style.width=pct+'%'; }); }
function renderR(d,q){
  show('results'); cd.stop(); document.getElementById('ringWrap').style.display='none';
  const opts=(q&&q.options)||currentOptions; const correct=(d.gameType||gameType)==='quiz'?d.correct:null;
  document.getElementById('rtext').textContent=correct!=null?'Correct answer + results':'The room has spoken!';
  const box=document.getElementById('bigbars');
  box.innerHTML=(d.percents||[]).map((pct,i)=>{ const isC=correct!=null&&correct===i; const isW=(d.winners||[]).includes(i); const mark=correct!=null?(isC?'✅':''):(isW?'👑':'');
    return `<div class="bbar${isC?' correct':''}" data-pct="${pct}"><div class="bfill i${i}" style="width:0%"></div><div class="bc"><span class="blt">${OPT_LETTERS[i]}</span><span class="blab">${esc(opts[i]||'')} ${mark}</span><span class="bpct" data-to="${pct}">0%</span></div></div>`;
  }).join('');
  box.querySelectorAll('.bbar').forEach((bar,idx)=>{ const pct=parseInt(bar.getAttribute('data-pct'),10)||0; setTimeout(()=>{ bar.querySelector('.bfill').style.width=pct+'%'; countUp(bar.querySelector('.bpct'),pct,1000); },140+idx*100); });
  shimmerBurst(130);
}
connectSSE({ room, role:'screen', handlers:{
  sync(s){ if(s.gameType){gameType=s.gameType;setTypeLabels();} totalPlayers=s.playerCount; document.getElementById('pcount').textContent=s.playerCount; document.getElementById('lc').textContent=s.playerCount;
    if(s.status==='LOBBY')show('lobby');
    else if(s.status==='QUESTION_ACTIVE'&&s.question)renderQ({...s.question,gameType:s.gameType,startedAt:s.timer&&s.timer.startedAt,durationMs:s.timer&&s.timer.durationMs});
    else if(s.status==='LOCKED')show('locked');
    else if(s.status==='RESULTS'&&s.results)renderR({...s.results,gameType:s.gameType},s.question);
    else if(s.status==='GAME_OVER'){show('over');renderLB(s.leaderboard);} },
  'lobby:update'(d){ document.getElementById('pcount').textContent=d.playerCount; document.getElementById('lc').textContent=d.playerCount; },
  'question:show'(q){ renderQ(q); },
  'vote:progress'(d){ document.getElementById('votecount').textContent=d.votedCount+' of '+d.totalCount+' voted'; if(d.counts)liveUpdate(d.counts); },
  'votes:locked'(){ show('locked'); },
  'results:reveal'(d){ renderR(d,{options:currentOptions}); },
  'game:over'(d){ show('over'); renderLB(d.leaderboard); },
  'game:restart'(d){ if(d&&d.gameType){gameType=d.gameType;setTypeLabels();} show('lobby'); },
}});
function renderLB(list){ document.getElementById('lb').innerHTML=leaderboardRowsHTML(list); }
setTypeLabels();
</script>
</body>
</html>
