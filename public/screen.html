<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Big Screen — Would You Rather / Quiz</title>
<link rel="stylesheet" href="/app.css">
<style>
  body{overflow:hidden}
  .stage{height:100vh;display:flex;flex-direction:column}
  .stage .body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;min-height:0}
  .huge{font-size:clamp(24px,4vw,54px);font-weight:900;line-height:1.15;margin:6px 0 22px;max-width:1150px}
  .bigopts{display:grid;gap:20px;width:min(1150px,94vw)}
  .bigopts.n2{grid-template-columns:1fr 1fr}
  .bigopts.n3{grid-template-columns:1fr 1fr 1fr}
  .bigopts.n4{grid-template-columns:1fr 1fr}
  @media(max-width:820px){.bigopts.n2,.bigopts.n3,.bigopts.n4{grid-template-columns:1fr}}
  .bigopt{border-radius:24px;min-height:22vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    font-size:clamp(16px,2vw,30px);font-weight:800;padding:22px;position:relative;
    background:var(--glass);border:1px solid var(--glass-brd);backdrop-filter:blur(14px) saturate(135%);
    box-shadow:var(--shadow), inset 0 1px 0 var(--glass-hi);animation:pop .45s cubic-bezier(.2,1.1,.3,1) both}
  .bigopt .lt{width:clamp(40px,4vw,58px);height:clamp(40px,4vw,58px);border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:clamp(20px,2.2vw,34px);font-weight:900;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3)}
  .bigopt .bt{position:relative;z-index:1;line-height:1.25;word-break:break-word}
  .bigopt::after{content:"";position:absolute;inset:0;border-radius:24px;pointer-events:none}
  .bigopt[data-i="0"]::after{background:radial-gradient(120% 85% at 50% 0%,rgba(161,0,255,.36),transparent 62%)}
  .bigopt[data-i="1"]::after{background:radial-gradient(120% 85% at 50% 0%,rgba(0,224,200,.32),transparent 62%)}
  .bigopt[data-i="2"]::after{background:radial-gradient(120% 85% at 50% 0%,rgba(255,79,216,.32),transparent 62%)}
  .bigopt[data-i="3"]::after{background:radial-gradient(120% 85% at 50% 0%,rgba(255,176,32,.32),transparent 62%)}
  .ring{font-size:clamp(26px,3.6vw,52px);font-weight:900}
  .ring.low{color:#ff7a7a;animation:blink 1s steps(2) infinite}
  .bigbars{display:flex;flex-direction:column;gap:14px;width:min(1150px,94vw)}
  .bbar{position:relative;height:clamp(58px,10vh,90px);border-radius:16px;overflow:hidden;background:rgba(0,0,0,.3);border:1px solid var(--glass-brd)}
  .bbar .bfill{position:absolute;left:0;top:0;bottom:0;width:0;opacity:.85;transition:width 1s cubic-bezier(.2,.8,.2,1)}
  .bfill.i0{background:linear-gradient(135deg,#7a1fd0,#A100FF)}.bfill.i1{background:linear-gradient(135deg,#0a9f92,#00E0C8)}
  .bfill.i2{background:linear-gradient(135deg,#c22aa0,#FF4FD8)}.bfill.i3{background:linear-gradient(135deg,#c98315,#FFB020)}
  .bbar .bc{position:relative;z-index:2;display:flex;align-items:center;gap:16px;height:100%;padding:0 22px}
  .bbar .blt{flex:0 0 auto;width:clamp(34px,3vw,46px);height:clamp(34px,3vw,46px);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:clamp(16px,1.8vw,24px);background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3)}
  .bbar .blab{flex:1;min-width:0;text-align:left;font-size:clamp(16px,1.9vw,28px);font-weight:700;overflow-wrap:anywhere;text-shadow:0 2px 6px rgba(0,0,0,.6)}
  .bbar .bpct{flex:0 0 auto;font-size:clamp(20px,2.4vw,36px);font-weight:900;text-shadow:0 2px 6px rgba(0,0,0,.6)}
  .bbar.correct{border-color:#2ee6a0;box-shadow:0 0 0 3px rgba(46,230,160,.45)}
  .bbar.correct .blt{background:#2ee6a0;color:#06231a}
  .joininfo{display:flex;gap:40px;align-items:center;justify-content:center;flex-wrap:wrap}
  .qr-lg{background:#fff;padding:16px;border-radius:20px;box-shadow:0 16px 46px rgba(0,0,0,.5)}
  .qr-lg img{display:block;width:clamp(180px,22vw,230px);height:auto}
  .lb-lg .row{font-size:clamp(17px,2vw,26px);padding:15px 20px}
  .topbar{display:flex;justify-content:space-between;align-items:center;padding:12px 28px;gap:12px}
</style>
</head>
<body>
<div class="stage">
  <div id="brand"></div>
  <div class="topbar">
    <div class="qcategory" id="cat" style="font-size:clamp(12px,1.4vw,20px)">READY</div>
    <div class="ring" id="timer"></div>
    <div class="badge win badge-count" style="font-size:clamp(14px,1.6vw,22px)">👥 <span id="pcount">0</span></div>
  </div>

  <div class="body">
    <div id="lobby">
      <div class="pill" id="lobbyPill" style="font-size:16px">🎉 Fun Friday · Currys project team</div>
      <div class="huge" id="lobbyTitle">Would You Rather?</div>
      <div class="joininfo">
        <div class="qr-lg"><img id="qr" alt="Scan to join" onerror="this.style.display='none'"></div>
        <div>
          <div style="font-size:20px" class="muted">Join at</div>
          <div id="joinurl" style="font-size:clamp(18px,2vw,28px);font-weight:700;color:#d9b6ff"></div>
          <div style="font-size:20px" class="muted mt2">Room code</div>
          <div class="roomcode" id="code">—</div>
        </div>
      </div>
      <div class="mt2 muted" style="font-size:20px"><span class="big" id="lc">0</span> players joined</div>
    </div>

    <div id="qview" class="hide" style="width:100%;display:flex;flex-direction:column;align-items:center">
      <div class="huge" id="qtext">…</div>
      <div class="bigopts" id="bigopts"></div>
      <div class="mt2 muted" style="font-size:22px" id="votecount">0 of 0 voted</div>
    </div>

    <div id="locked" class="hide">
      <div class="huge">🔒 Votes locked!</div>
      <div class="muted" style="font-size:24px">Revealing…</div>
    </div>

    <div id="results" class="hide" style="width:100%;display:flex;flex-direction:column;align-items:center">
      <div class="huge" id="rtext" style="margin-bottom:12px">The room has spoken!</div>
      <div class="bigbars" id="bigbars"></div>
    </div>

    <div id="over" class="hide" style="width:100%;max-width:800px">
      <div class="huge">🏆 Final Leaderboard</div>
      <div class="list lb-lg" id="lb"></div>
      <div class="muted mt2" style="font-size:20px">Thanks for playing! 🎉</div>
    </div>
  </div>
</div>

<script src="/shared.js"></script>
<script>
addBlobs();
document.getElementById('brand').innerHTML = BRAND_BAR;
const room = (new URLSearchParams(location.search).get('room')||'').toUpperCase();
if (!room){ document.body.innerHTML='<div class="center"><h1>Add ?room=CODE to the URL</h1></div>'; }

let gameType='wyr', currentOptions=[];
const views=['lobby','qview','locked','results','over'];
function show(id){ views.forEach(v=>{ const el=document.getElementById(v); if(el) el.classList.toggle('hide', v!==id); }); }

const joinUrl = location.origin + '/?room=' + room;
document.getElementById('code').textContent = room;
document.getElementById('joinurl').textContent = location.host;
document.getElementById('qr').src = qrImageURL(joinUrl, 230);

const cd = makeCountdown((r)=>{ const t=document.getElementById('timer'); const s=Math.ceil(r/1000); t.textContent=r>0?s+'s':''; t.classList.toggle('low', s<=5 && r>0); });

function setTypeLabels(){
  document.getElementById('lobbyTitle').textContent = gameType==='quiz' ? 'Quiz Time! 🧠' : 'Would You Rather?';
  document.getElementById('cat').textContent = gameType==='quiz' ? 'QUIZ' : 'WOULD YOU RATHER';
}
function renderQ(q){
  show('qview'); currentOptions=q.options||[]; if(q.gameType)gameType=q.gameType;
  document.getElementById('cat').textContent = (q.category||'').toUpperCase() || (gameType==='quiz'?'QUIZ':'WOULD YOU RATHER');
  document.getElementById('qtext').textContent = q.prompt || (gameType==='quiz'?'Question':'Would you rather…');
  const wrap=document.getElementById('bigopts'); wrap.className='bigopts n'+currentOptions.length;
  wrap.innerHTML=currentOptions.map((t,i)=>`<div class="bigopt" data-i="${i}"><span class="lt">${OPT_LETTERS[i]}</span><span class="bt">${esc(t)}</span></div>`).join('');
  if (q.startedAt && q.durationMs) cd.start(q.startedAt, q.durationMs);
}
function renderR(d, q){
  show('results'); cd.stop(); document.getElementById('timer').textContent='';
  const opts=(q&&q.options)||currentOptions; const correct=(d.gameType||gameType)==='quiz'?d.correct:null;
  document.getElementById('rtext').textContent = correct!=null ? 'Correct answer + results' : 'The room has spoken!';
  document.getElementById('bigbars').innerHTML = (d.percents||[]).map((pct,i)=>{
    const isC = correct!=null && correct===i; const isW=(d.winners||[]).includes(i);
    const mark = correct!=null ? (isC?'✅':'') : (isW?'👑':'');
    return `<div class="bbar${isC?' correct':''}"><div class="bfill i${i}" style="width:${pct}%"></div>
      <div class="bc"><span class="blt">${OPT_LETTERS[i]}</span><span class="blab">${esc(opts[i]||'')} ${mark}</span><span class="bpct">${pct}%</span></div></div>`;
  }).join('');
  confettiBurst(120);
}

connectSSE({ room, role:'screen', handlers:{
  sync(s){
    if(s.gameType){gameType=s.gameType;setTypeLabels();}
    document.getElementById('pcount').textContent=s.playerCount; document.getElementById('lc').textContent=s.playerCount;
    if (s.status==='LOBBY') show('lobby');
    else if (s.status==='QUESTION_ACTIVE' && s.question) renderQ({...s.question, gameType:s.gameType, startedAt:s.timer&&s.timer.startedAt, durationMs:s.timer&&s.timer.durationMs});
    else if (s.status==='LOCKED') show('locked');
    else if (s.status==='RESULTS' && s.results) renderR({...s.results, gameType:s.gameType}, s.question);
    else if (s.status==='GAME_OVER'){ show('over'); renderLB(s.leaderboard); }
  },
  'lobby:update'(d){ document.getElementById('pcount').textContent=d.playerCount; document.getElementById('lc').textContent=d.playerCount; },
  'question:show'(q){ renderQ(q); },
  'vote:progress'(d){ document.getElementById('votecount').textContent=d.votedCount+' of '+d.totalCount+' voted'; },
  'votes:locked'(){ show('locked'); },
  'results:reveal'(d){ renderR(d, {options:currentOptions}); },
  'game:over'(d){ show('over'); renderLB(d.leaderboard); },
  'game:restart'(d){ if(d&&d.gameType){gameType=d.gameType;setTypeLabels();} show('lobby'); },
}});

function renderLB(list){ document.getElementById('lb').innerHTML = leaderboardRowsHTML(list); }
setTypeLabels();
</script>
</body>
</html>
