<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#05030F">
<title>Fun Friday Arena — The Show</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://d8j0ntlcm91z4.cloudfront.net" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@400;500;700&family=Sora:wght@300..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/theme.css?v=29">
<link rel="stylesheet" href="/assets/arena.css?v=29">
<style>
/* Projector view, 1920×1080 first — readable from the back of the room. */
body{overflow:hidden;height:100vh}
.sv{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0;transition:opacity 1.2s}
.sv.on{opacity:1}
.sv video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#v1{opacity:.25}#v6{opacity:.45}
.sv::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,transparent 30%,rgba(5,3,15,.85))}
.river{background:transparent!important}
.show{position:relative;z-index:2;height:100vh;display:flex;flex-direction:column;padding:2.4vh 3vw 0}
.top{display:flex;align-items:center;justify-content:space-between;gap:20px}
.top .meta{font:500 clamp(12px,1vw,18px) var(--f-mono);letter-spacing:.2em;text-transform:uppercase;color:var(--mist)}
.view{flex:1;min-height:0;display:none;flex-direction:column}
.view.on{display:flex}
.crewbig{position:relative;height:30vh;flex:none}
.crewbig .crew-band{position:absolute;inset:0}
/* lobby */
.lob{flex:1;display:grid;grid-template-columns:1.05fr 1fr;gap:3vw;align-items:center;min-height:0}
.codebox{padding:3vh 2.4vw;border-radius:32px;text-align:center}
.codebox .k{font:500 clamp(12px,1vw,18px) var(--f-mono);letter-spacing:.24em;text-transform:uppercase;color:var(--mist)}
.codebox .url{font:600 clamp(18px,1.9vw,34px) var(--f-ui);margin:1vh 0 2vh;word-break:break-all}
.code{display:inline-block;font:700 clamp(64px,8.6vw,170px)/1 var(--f-mono);letter-spacing:.12em;padding:1.4vh 1.6vw;border-radius:22px}
.qr{display:inline-block;margin-top:2.4vh;padding:10px;border-radius:22px;background:conic-gradient(from 200deg,#6f6990,#f3eeff,#8b85a8,#ffffff,#5e587c,#d9d4ec,#6f6990)}
.qr img{width:clamp(150px,13vw,250px);height:auto;border-radius:14px;background:#fff;padding:8px;display:block}
.wall{position:relative;height:100%;max-height:58vh;overflow:hidden;border-radius:28px;padding:2vh 1.6vw}
.wall h3{margin:0 0 1.4vh;display:flex;justify-content:space-between;align-items:baseline;font:500 clamp(12px,1vw,18px) var(--f-mono);letter-spacing:.2em;text-transform:uppercase;color:var(--mist)}
.wall h3 b{font:700 clamp(40px,4.4vw,84px)/1 var(--f-mono);color:var(--pearl);letter-spacing:0}
.tiles{display:flex;flex-wrap:wrap;gap:10px;align-content:flex-start}
.tile{display:inline-flex;align-items:center;gap:8px;padding:8px 14px 8px 8px;border-radius:999px;font:600 clamp(14px,1.15vw,22px) var(--f-ui);background:rgba(243,238,255,.07);box-shadow:inset 0 0 0 1px rgba(243,238,255,.14);
  animation:drop .7s cubic-bezier(.3,1.4,.5,1) both}
.tile .av-ini{flex:none}
@keyframes drop{from{opacity:0;transform:translateY(-60vh) rotate(-8deg)}}
/* question */
.qhead{text-align:center;margin-top:1vh}
.qhead .ey{font:500 clamp(13px,1.1vw,20px) var(--f-mono);letter-spacing:.2em;text-transform:uppercase;color:var(--mist)}
.qhead h1{font:600 clamp(32px,3.9vw,76px)/1.15 var(--f-ui);letter-spacing:-.015em;margin:1.4vh auto 0;max-width:80vw;text-wrap:balance}
.arena{flex:1;min-height:0;display:grid;grid-template-columns:1fr auto 1fr;gap:2vw;align-items:center;margin-top:2vh}
.arena.four{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.opt{position:relative;height:100%;max-height:34vh;min-height:20vh;border-radius:30px;padding:2.6vh 2vw;display:flex;flex-direction:column;overflow:hidden}
.arena.four .opt{max-height:none;min-height:0}
.opt .k{display:flex;align-items:center;gap:12px}
.opt .chip{width:clamp(36px,3vw,58px);height:clamp(36px,3vw,58px);border-radius:14px;display:grid;place-items:center;font:400 clamp(18px,1.6vw,30px) var(--f-disp);background:linear-gradient(135deg,var(--acn),var(--violet))}
.opt:nth-child(3) .chip,.arena.four .opt:nth-child(2) .chip{background:linear-gradient(135deg,#0086C3,var(--cyan))}
.opt .t{font:600 clamp(22px,2.2vw,42px)/1.25 var(--f-ui);margin-top:1.6vh;position:relative;z-index:1}
.opt .pc{margin-top:auto;font:700 clamp(40px,4vw,80px)/1 var(--f-mono);opacity:0;position:relative;z-index:1}
.opt.res .pc{opacity:1;transition:opacity .4s}
.opt .liq{position:absolute;left:0;right:0;bottom:0;height:100%;z-index:-1;transform-origin:bottom;transform:scaleY(0);transition:transform 1s cubic-bezier(.3,1.25,.4,1);background:linear-gradient(to top,rgba(161,0,255,.45),rgba(161,0,255,.12))}
.opt:nth-child(3) .liq{background:linear-gradient(to top,rgba(0,174,239,.42),rgba(0,174,239,.1))}
.opt .bucket{position:absolute;left:0;right:0;bottom:0;height:46%;pointer-events:none}
.opt.major{box-shadow:inset 0 0 0 3px #C77DFF,0 0 80px -20px rgba(161,0,255,.8)}
.opt.correct{box-shadow:inset 0 0 0 3px #2BE08A,0 0 90px -20px rgba(43,224,138,.8)}
.opt.correct .liq{background:linear-gradient(to top,rgba(43,224,138,.55),rgba(43,224,138,.15))}
.opt.wrong{opacity:.72;box-shadow:inset 0 0 0 2px rgba(255,77,109,.85)}
.opt.wrong .liq{background:linear-gradient(to top,rgba(255,77,109,.45),rgba(255,77,109,.1))}
.semo{position:fixed;z-index:40;display:flex;flex-direction:column;align-items:center;gap:3px;pointer-events:none;animation:semo 3s cubic-bezier(.2,.8,.2,1) both}
.semo i{font-style:normal;font-size:clamp(34px,3vw,58px);line-height:1;animation:semoSpin 3s ease-in-out both}
.semo b{font:600 clamp(11px,.9vw,16px) var(--f-ui);padding:3px 10px;border-radius:999px;background:rgba(12,7,34,.78);box-shadow:inset 0 0 0 1px rgba(243,238,255,.22)}
@keyframes semo{0%{opacity:0;transform:scale(.2)}12%{opacity:1;transform:scale(1.25)}24%{transform:scale(1)}100%{opacity:0;transform:translate(var(--dx),-16vh) scale(.9)}}
@keyframes semoSpin{0%{transform:rotateY(0) rotate(-18deg)}30%{transform:rotateY(360deg) rotate(8deg)}60%{transform:rotateY(360deg) rotate(-5deg)}100%{transform:rotateY(360deg) rotate(0)}}
.opt.dim{opacity:.62}
.opt .crown{position:absolute;right:2vw;top:1.6vh;width:clamp(50px,4vw,80px);opacity:0;transform:translateY(-20px) rotate(-14deg);transition:all .7s var(--spring) .4s}
.opt.major .crown,.opt.correct .crown{opacity:1;transform:none}
.ring{position:relative;width:clamp(150px,12vw,240px);aspect-ratio:1;display:grid;place-items:center}
.arena.four .ring{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:3;width:clamp(110px,8vw,150px)}
.arena.four .opt:nth-child(2n){padding-left:calc(2vw + 40px)}
.arena.four{position:relative}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring .disc{position:absolute;inset:14%;border-radius:50%;display:grid;place-items:center;align-content:center;background:radial-gradient(circle at 35% 30%,rgba(243,238,255,.16),transparent 45%),rgba(12,7,34,.85);box-shadow:inset 0 0 0 1px rgba(243,238,255,.2)}
.ring .vs{font:400 clamp(14px,1.2vw,22px) var(--f-disp);letter-spacing:.14em;color:var(--mist)}
.ring .sec{font:700 clamp(36px,3.4vw,66px)/1 var(--f-mono)}
.foot{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:1.4vh 0 2vh;font:500 clamp(12px,1vw,18px) var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--mist)}
.ff{position:fixed;left:50%;top:13vh;z-index:30;transform:translateX(-50%);display:flex;align-items:center;gap:14px;padding:14px 26px 14px 14px;border-radius:999px;font:600 clamp(18px,1.6vw,30px) var(--f-ui);
  background:var(--lime);color:#0B1400;animation:ffIn .7s var(--spring) both}
.ff::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.8) 50%,transparent 70%);transform:translateX(-120%);animation:flashx .9s ease .3s forwards}
@keyframes flashx{to{transform:translateX(120%)}}@keyframes ffIn{from{opacity:0;transform:translate(-50%,-40px)}}
/* board */
.board{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:1.2vh 2vw;align-content:start;margin-top:3vh}
.lrow{display:grid;grid-template-columns:4vw 1fr auto;align-items:center;gap:1vw;padding:1.6vh 1.4vw;border-radius:20px;font:600 clamp(18px,1.6vw,32px) var(--f-ui);opacity:0;animation:rowIn .6s var(--ease) forwards;animation-delay:calc(var(--n)*60ms)}
@keyframes rowIn{from{opacity:0;transform:translateX(-30px)}to{opacity:1;transform:none}}
.lrow .r{font:700 1em var(--f-mono);color:var(--mist)}.lrow .s{font:700 1em var(--f-mono)}
.lrow:first-child{box-shadow:inset 0 0 0 2px var(--lime)}
/* tug of war */
.tug{display:none;align-items:center;gap:14px;margin:1vh auto 0;width:min(80vw,1200px);font:600 clamp(14px,1.1vw,20px) var(--f-ui)}
.tug.on{display:flex}
.tug .rope{position:relative;flex:1;height:10px;border-radius:999px;background:linear-gradient(90deg,var(--acn),var(--cyan))}
.tug .knot{position:absolute;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--pearl);box-shadow:0 0 0 4px rgba(243,238,255,.25);left:50%;transition:left 1s var(--spring)}
/* podium */
.pod{flex:1;display:flex;align-items:flex-end;justify-content:center;gap:2vw;padding-bottom:2vh}
.pil{min-height:180px;width:clamp(180px,16vw,300px);border-radius:24px 24px 0 0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:2vh;transform-origin:bottom;animation:rise 1.1s var(--ease) both}
.pil .n{font:400 clamp(60px,6vw,120px)/1 var(--f-disp)}
.pil .nm{font:600 clamp(18px,1.6vw,30px) var(--f-ui);margin-top:1vh;text-align:center;padding:0 10px}
.pil .sc{font:700 clamp(16px,1.3vw,24px) var(--f-mono);color:var(--mist)}
@keyframes rise{from{transform:scaleY(0)}}
.mission{font:400 clamp(70px,9vw,180px)/.9 var(--f-disp);text-transform:uppercase;text-align:center;margin:2vh 0 0}
/* spotlight + reactions */
.spot{position:fixed;inset:0;z-index:60;pointer-events:none;display:grid;place-items:center;background:radial-gradient(circle at 50% 50%,transparent 18vmin,rgba(2,1,8,.86) 30vmin);animation:spot 4s ease forwards}
.spot b{font:400 clamp(60px,8vw,160px)/1 var(--f-disp);text-transform:uppercase;animation:sweep 4s var(--ease) forwards}
@keyframes spot{0%,100%{opacity:0}10%,85%{opacity:1}}@keyframes sweep{0%{transform:translateX(-70vw)}25%,80%{transform:none}100%{transform:translateX(70vw)}}
.rx{position:fixed;bottom:-60px;z-index:40;font-size:clamp(30px,2.6vw,52px);pointer-events:none;animation:rxUp 3s var(--ease) forwards}
@keyframes rxUp{to{transform:translate(var(--dx),-80vh) scale(1.2);opacity:0}}
.drum{position:fixed;inset:0;z-index:50;background:rgba(2,1,8,.65);pointer-events:none;opacity:0;transition:opacity .3s}.drum.on{opacity:1}
.drop{position:absolute;width:6px;height:6px;border-radius:50%;background:var(--pearl);top:-10px;animation:vdrop .9s cubic-bezier(.5,0,.8,.6) forwards}
@keyframes vdrop{to{transform:translateY(var(--h));opacity:.15}}
/* v29: credit never runs under the mute button */
.foot{padding-right:64px}
</style>
</head>
<body>
<div class="sv" id="sv1"><video id="v1" muted loop playsinline preload="none" data-src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260331_045634_e1c98c76-1265-4f5c-882a-4276f2080894.mp4"></video></div>
<div class="sv" id="sv6"><video id="v6" muted loop playsinline preload="none" data-src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260331_055729_72d66327-b59e-4ae9-bb70-de6ccb5ecdb0.mp4"></video></div>
<div class="show">
  <div class="top"><div id="brand"></div><div class="meta" id="meta">Fun Friday Arena</div></div>
  <div class="tug" id="tug"><span id="tA"></span><div class="rope"><i class="knot" id="knot"></i></div><span id="tB"></span></div>

      <div class="codebox lg"><div class="k">Join at</div><div class="url" id="joinHost"></div><div class="k">Room code</div><div class="code holo lg" id="lobbyCode">—</div><div><div class="qr" id="qr"></div></div></div>

    </div>
  </section>

    <div class="qhead"><div class="ey" id="qey"></div><h1 id="qtext"></h1></div>

</div>

<script>
(function(){
  var F=window.FFA,A=window.Arena,R=window.River,esc=F.esc,$=F.$;
  $('#brand').innerHTML=F.brandBar();
  A.boot({fx:false});FX.init&&0;
  var room=(new URLSearchParams(location.search).get('room')||F.store.get('ffa-host-room')||'').toUpperCase();
  if(!room){$('#vLobby').classList.add('on');$('#lobbyCode').textContent='NO ROOM';$('#phase').textContent='Open the big screen from the host console';return;}
  A.syncClock();
  var crew=Crew.mount($('#crewbig'),{home:{momo:.38,noodle:.5,bean:.62},min:600,fill:.8});
  var S={q:null,nodes:[],counts:[],raf:0,boardT:0,skinSet:false,settings:{}};
  /* one video at a time */
  var cur=null;function video(id){['sv1','sv6'].forEach(function(s){var on=s===id,el=$('#'+s),v=el.querySelector('video');el.classList.toggle('on',on);
    if(on){if(!v.dataset.on){v.dataset.on=1;v.src=v.dataset.src;}var p=v.play();if(p&&p.catch)p.catch(function(){});}else try{v.pause();}catch(e){}});}
  function view(k){['vLobby','vQ','vBoard','vOver'].forEach(function(v){$('#'+v).classList.toggle('on',v===k);});}
  function paintJoin(base){var u=base+'/join?room='+room;$('#joinHost').textContent=base.replace(/^https?:\/\//,'')+'/join';$('#qr').innerHTML='<img alt="Join QR" src="'+F.qrURL(u,500)+'">';}
  $('#lobbyCode').textContent=room;paintJoin(location.origin);
  fetch('/api/config').then(function(r){return r.json();}).then(function(c){if(c&&c.publicUrl)paintJoin(c.publicUrl);}).catch(function(){});
  function lobby(n){view('vLobby');video('sv1');R.mood('lobby');$('#lobbyCount').textContent=n||0;$('#phase').textContent='Scan the code · pick a sidekick · you\u2019re in';crew.moment('lobby');}
  var tiles=$('#tiles');
  function addTiles(names,sks){names.forEach(function(n,i){var t=document.createElement('span');t.className='tile';t.style.animationDelay=(i*70)+'ms';
    t.innerHTML=A.initials(n,30)+esc(n);tiles.insertBefore(t,tiles.firstChild);});
    while(tiles.children.length>80)tiles.removeChild(tiles.lastChild);}
  /* ---------- question ---------- */
  function ring(){return '<div class="ring" id="ring"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="none" stroke="rgba(243,238,255,.08)" stroke-width="3"/><circle class="arc" cx="50" cy="50" r="46" fill="none" stroke-width="3" stroke-linecap="round" stroke="#00AEEF" pathLength="100" stroke-dasharray="100" stroke-dashoffset="0"/></svg><div class="disc"><span class="vs">VS</span><span class="sec num">--</span></div></div>';}
  function crownSVG(){return '<svg class="crown" viewBox="0 0 46 34"><defs><linearGradient id="scg" x1="0" x2="1"><stop offset="0" stop-color="#8b85a8"/><stop offset=".45" stop-color="#fff"/><stop offset="1" stop-color="#a9a3c4"/></linearGradient></defs><path d="M3,30 L6,8 L16,18 L23,3 L30,18 L40,8 L43,30Z" fill="url(#scg)"/></svg>';}
  function renderQ(q){
    S.q=q;S.counts=q.options.map(function(){return 0;});clearTimeout(S.boardT);view('vQ');video(null);
    $('#qey').textContent='Question '+q.questionNumber+' of '+q.totalQuestions+(q.round?' · '+q.round:'');
    A.kinetic($('#qtext'),q.prompt);
    var n=q.options.length,two=n===2,h='';
    q.options.forEach(function(t,i){h+='<div class="opt lg holo" data-i="'+i+'"><span class="liq"></span><div class="k"><span class="chip">'+String.fromCharCode(65+i)+'</span></div><div class="t">'+esc(t)+'</div><div class="pc num">0%</div><div class="bucket"></div>'+crownSVG()+'</div>';
      if(two&&i===0)h+=ring();});
    if(!two)h+=ring();
    var ar=$('#arena');ar.className='arena'+(two?'':' four');ar.innerHTML=h;S.nodes=F.$$('.opt',ar);
    crew.moment('answer');tick();}
  function tick(){cancelAnimationFrame(S.raf);var q=S.q;(function f(){if(S.q!==q)return;var now=A.serverNow(),rem,frac,p;
    if(now<q.answerAt){p='read';rem=q.answerAt-now;frac=q.readMs?rem/q.readMs:0;}else{p='answer';rem=q.answerAt+q.durationMs-now;frac=Math.max(0,rem/q.durationMs);}
    if(S.frozen){S.raf=requestAnimationFrame(f);return;}
    var r=$('#ring');if(r){var a=r.querySelector('.arc');a.setAttribute('stroke-dashoffset',(100-Math.max(0,Math.min(1,frac))*100).toFixed(2));a.setAttribute('stroke',p==='read'?'#5FD8FF':frac>.5?'#00AEEF':frac>.25?'#A100FF':'#FF3D8B');
      var s=Math.max(0,Math.ceil(rem/1000));r.querySelector('.sec').textContent=s<10?'0'+s:s;}
    if(p!==S.phase){S.phase=p;$('#phase').textContent=p==='read'?'Reading time — the room holds its breath':'Answering now — fastest finger scores most';R.mood(p==='read'?'read':'answer');if(p==='read')crew.moment('read');}
    if(p==='answer'&&rem<3200&&rem>0)R.mood('last3');
    if(rem<=0&&p==='answer')return;S.raf=requestAnimationFrame(f);})();}
  /* vote rain: each incoming vote is a particle falling into its bucket */
  function rain(counts){counts.forEach(function(c,i){var d=c-(S.counts[i]||0);S.counts[i]=c;var b=S.nodes[i]&&S.nodes[i].querySelector('.bucket');if(!b||d<=0)return;
    for(var k=0;k<Math.min(d,14);k++){var e=document.createElement('i');e.className='drop';e.style.left=(8+Math.random()*84)+'%';e.style.setProperty('--h',(b.offsetHeight-6)+'px');e.style.animationDelay=(k*40)+'ms';
      b.appendChild(e);setTimeout(function(x){return function(){x.remove();};}(e),1100+k*40);}});}
  function reveal(d){
    cancelAnimationFrame(S.raf);R.mood('calm');var quiz=d.gameType==='quiz',tie=d.winners.length>=S.nodes.length;
    $('#phase').textContent=d.total+(d.total===1?' answer':' answers')+' in';
    S.nodes.forEach(function(n,i){n.classList.add('res');var pc=d.percents[i]||0;FX.countUp({set textContent(v){n.querySelector('.pc').textContent=v+'%';}},0,pc,1000);
      n.querySelector('.liq').style.transform='scaleY('+Math.max(.02,pc/100)+')';
      if(quiz)n.classList.add(i===d.correct?'correct':'wrong');else n.classList.add(!tie&&d.winners.indexOf(i)>=0?'major':'dim');});
    var w=quiz?d.correct:d.winners[0];
    setTimeout(function(){if(S.nodes[w]&&!tie){var r=S.nodes[w].getBoundingClientRect();R.pour(r.left+r.width/2,r.top+r.height/2,1600);
      FX.burst(r.left+10,r.bottom-10,60,{angle:-Math.PI/3,spread:.7,speed:16});FX.burst(r.right-10,r.bottom-10,60,{angle:-Math.PI*2/3,spread:.7,speed:16});}
      if(d.fastest){var ff=document.createElement('div');ff.className='ff';ff.innerHTML='⚡ Fastest finger · '+esc(d.fastest.name)+' · '+F.fmtMs(d.fastest.ms);document.body.appendChild(ff);setTimeout(function(){ff.remove();},5000);}
      crew.playGroup(quiz?'crowd':(tie?'slapstick':'crowd'),{pts:'+150'});},400);
    /* 4 s Crew Comedy interlude, then the board */
    clearTimeout(S.boardT);S.boardT=setTimeout(function(){crew.playGroup('slapstick');S.boardT=setTimeout(function(){view('vBoard');},4200);},5600);}
  function board(top){var b=$('#board');b.innerHTML=(top||[]).slice(0,10).map(function(p,i){return '<div class="lrow lg" style="--n:'+i+'"><span class="r">'+(p.rank<10?'0'+p.rank:p.rank)+'</span><span>'+
    '<span style="display:inline-block;vertical-align:middle;margin-right:12px">'+A.initials(p.name,34)+'</span>'+esc(p.name)+'</span><span class="s">'+p.score+'</span></div>';}).join('');}
  function tug(teams){var t=$('#tug');if(!teams||teams.length<2){t.classList.remove('on');return;}t.classList.add('on');
    var a=teams[0],b=teams[1],tot=Math.max(1,a.score+b.score);$('#tA').textContent=a.team+' '+a.score;$('#tB').textContent=b.score+' '+b.team;
    $('#knot').style.left=(50-((a.score-b.score)/tot)*40)+'%';}
  function over(d){
    cancelAnimationFrame(S.raf);view('vOver');video('sv6');R.mood('calm');A.kinetic($('#mission'),'Mission complete');
    var lb=d.leaderboard||[],order=[1,0,2],h=[34,24,18];
    $('#pod').innerHTML=order.map(function(i,k){var p=lb[i];if(!p)return '';return '<div class="pil lg holo" style="height:'+h[i]+'vh;animation-delay:'+(k*200)+'ms"><div class="n">'+(i+1)+'</div><div class="nm">'+esc(p.name)+'</div><div class="sc">'+p.score+' pts</div></div>';}).join('');
    setTimeout(function(){crew.play('podium',{winner:(lb[0]&&lb[0].name)||'WINNER'});FX.cannons();setTimeout(function(){FX.cannons();},1400);},900);
    $('#phase').textContent=[(d.totalPlayers?d.totalPlayers+' players':''),(d.totalQuestions?d.totalQuestions+' questions':'')].filter(Boolean).join(' · ')||'Thanks for playing';}
  function setSkin(s){if(!s)return;crew.setSkin(s==='default'?null:s);S.settings.skin=s;}
  F.connect({room:room,role:'screen',on:{
    __open:function(){A.offline(false);},__drop:function(){A.offline(true);},
    'state:sync':function(d){A.offline(false);S.settings=d;if(d.recentNames&&!tiles.children.length)addTiles(d.recentNames.slice().reverse(),d.recentSk.slice().reverse());setSkin(d.skin);$('#crewbig').hidden=d.crew===false;
      if(d.status==='LOBBY')lobby(d.playerCount);
      else if((d.status==='QUESTION_ACTIVE'||d.status==='LOCKED')&&d.question&&d.timer)renderQ({prompt:d.question.prompt,options:d.question.options,round:d.question.round,questionNumber:d.questionNumber,totalQuestions:d.totalQuestions,answerAt:d.timer.answerAt,readMs:d.timer.readMs,durationMs:d.timer.durationMs});
      else if(d.status==='RESULTS'){view('vBoard');board(d.leaderboard);}
      else if(d.status==='GAME_OVER')over({leaderboard:d.leaderboard,totalPlayers:d.playerCount});},
    'lobby:update':function(d){$('#lobbyCount').textContent=d.playerCount;if(d.newNames&&d.newNames.length){addTiles(d.newNames,d.sidekicks);if(crew.mode==='lobby')crew.welcome(d.newNames);}},
    'question:show':function(q){FX.transition('Q'+q.questionNumber,function(){renderQ(q);});},
    'vote:progress':function(d){$('#phase').textContent=d.votedCount+' of '+d.totalCount+' answered'+(d.lockedCount?' · '+d.lockedCount+' locked':'');rain(d.counts||[]);},
    'votes:locked':function(){cancelAnimationFrame(S.raf);$('#phase').textContent='Voting closed — counting…';},
    'results:reveal':reveal,
    'leaderboard:update':function(d){board(d.top);tug(d.teams);},
    'game:over':over,
    'game:restart':function(d){tiles.innerHTML='';lobby(d.playerCount);},
    'react':function(d){var E=['😂','🔥','😱','👏','💜','😎','😜','🥺'],iv=d.iv||1000,live=document.querySelectorAll('.semo').length;
      (d.who||[]).forEach(function(w){for(var c=0;c<Math.min(w[2],3);c++){if(live++>60)return;var e=document.createElement('div');e.className='semo';
        e.innerHTML='<i>'+E[w[1]]+'</i><b>'+esc(w[0])+'</b>';e.style.left=(4+Math.random()*88)+'vw';e.style.top=(14+Math.random()*60)+'vh';
        e.style.setProperty('--dx',((Math.random()-.5)*10)+'vw');var dl=Math.floor(Math.random()*iv);e.style.animationDelay=dl+'ms';e.querySelector('i').style.animationDelay=dl+'ms';
        document.body.appendChild(e);setTimeout(function(x){return function(){x.remove();};}(e),3300+dl);}});},
    'crew:chaos':function(){crew.chaos();},
    'crew:drumroll':function(d){var dr=$('#drum');dr.classList.add('on');SFX.drumroll(d.ms);setTimeout(function(){dr.classList.remove('on');},d.ms||2000);},
    'spotlight':function(d){var s=document.createElement('div');s.className='spot';s.innerHTML='<b>'+esc(d.name)+'</b>';document.body.appendChild(s);SFX.whoosh();setTimeout(function(){s.remove();},4100);},
    'timer:freeze':function(){S.frozen=true;$('#phase').textContent='Timer frozen ❄';},
    'timer:resume':function(t){S.frozen=false;if(S.q){S.q.answerAt=t.answerAt;S.q.durationMs=t.durationMs;S.phase=null;tick();}}
  }});
})();
</script>
</body>
